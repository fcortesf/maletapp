name: maletapp-gateway

services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_FEATURES: ${KEYCLOAK_FEATURES:-}
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/maletapp-realm.json:/opt/keycloak/data/import/maletapp-realm.json:ro
    networks: [edge]

  gateway:
    build: .
    ports:
      - "127.0.0.1:5000:3000"
    environment:
      NODE_ENV: development
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY:-http://localhost:8080/realms/maletapp}
      KEYCLOAK_INTERNAL_ORIGIN: ${KEYCLOAK_INTERNAL_ORIGIN-http://keycloak:8080}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-api://maletapp}
      DOMAIN_API_URL: http://domain-api:5110
    depends_on:
      - keycloak
      - domain-api
    networks: [edge, internal]

  mcp:
    profiles: [mcp]
    build: ../mcp
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5001
      MCP_RESOURCE_URL: http://localhost:5001/mcp
      KEYCLOAK_AUTHORITY: ${KEYCLOAK_AUTHORITY:-http://localhost:8080/realms/maletapp}
      KEYCLOAK_INTERNAL_ORIGIN: ${KEYCLOAK_INTERNAL_ORIGIN-http://keycloak:8080}
      GATEWAY_URL: http://gateway:3000
      GATEWAY_AUDIENCE: ${KEYCLOAK_AUDIENCE:-api://maletapp}
      EXCHANGE_CLIENT_ID: ${EXCHANGE_CLIENT_ID:-maletapp-mcp}
      EXCHANGE_CLIENT_SECRET: ${EXCHANGE_CLIENT_SECRET:-}
      EXCHANGE_AUDIENCE: ${EXCHANGE_AUDIENCE:-maletapp-api}
      ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    networks: [edge]

  domain-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    build:
      context: ..
      dockerfile: gateway/docker/domain-api.Dockerfile
    networks: [internal]

networks:
  edge:
  internal:
    internal: true
volumes:
  keycloak-data:
