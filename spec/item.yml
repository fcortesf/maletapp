openapi: 3.0.0
info:
  title: Items API
  description: Maletapp Items API
  version: 0.0.2

paths:
  /baggages/{baggageId}/items:
    get:
      tags:
        - Items
      summary: List items in a specific baggage
      operationId: listItemsByBaggage
      parameters:
        - name: baggageId
          in: path
          required: true
          description: The unique identifier of the baggage
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

    post:
      tags:
        - Items
      summary: Create a new item inside a specific baggage
      operationId: createItemInBaggage
      parameters:
        - name: baggageId
          in: path
          required: true
          description: The unique identifier of the baggage
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

  /trips/{tripId}/items:
    get:
      tags:
        - Items
      summary: List items for a specific trip
      operationId: listItemsByTrip
      parameters:
        - name: tripId
          in: path
          required: true
          description: The unique identifier of the trip
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

    post:
      tags:
        - Items
      summary: Create a new item directly under a trip
      description: Internally, the item will be assigned to a default baggage for this trip
      operationId: createItemInTrip
      parameters:
        - name: tripId
          in: path
          required: true
          description: The unique identifier of the trip
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

  /items/{itemId}:
    delete:
      tags:
        - Items
      summary: Delete an item owned by the current user
      operationId: deleteItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item deleted; trip, baggage and other items preserved
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Item not found
        '500':
          description: Internal server error

    get:
      tags:
        - Items
      summary: Get an item by ID
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          description: The unique identifier of the item
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

    patch:
      tags:
        - Items
      summary: Partially update item (e.g., rename it or update packed state)
      operationId: patchItem
      parameters:
        - name: itemId
          in: path
          required: true
          description: The unique identifier of the item
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchItem'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

components:
  schemas:
    NewItem:
      type: object
      properties:
        notes:
          type: string
          nullable: true
          description: Free-text comments or packing instructions for this item; null means unspecified
        itemCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: Number of units to bring; null means unspecified, not zero or one
        name:
          type: string
          description: The name of the item
        defaultItemId:
          type: string
          format: uuid
          description: Optional reference to a predefined item from another API
      required:
        - name

    PatchItem:
      type: object
      properties:
        notes:
          type: string
          nullable: true
          description: Free-text comments or packing instructions for this item; null means unspecified
        itemCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: Number of units to bring; null means unspecified, not zero or one
        name:
          type: string
          description: The name of the item
        defaultItemId:
          type: string
          format: uuid
          description: Optional reference to a predefined item from another API
        isPacked:
          type: boolean
          description: Whether the item is already packed

    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier for the item
        tripId:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier for the trip
        baggageId:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier for the baggage
        notes:
          type: string
          nullable: true
          description: Free-text comments or packing instructions for this item; null means unspecified
        itemCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: Number of units to bring; null means unspecified, not zero or one
        name:
          type: string
          description: The name of the item
        isPacked:
          type: boolean
          readOnly: true
          description: Whether the item is already packed
        defaultItemId:
          type: string
          format: uuid
          description: Optional reference to a predefined item from another API
      required:
        - id
        - name
        - isPacked
