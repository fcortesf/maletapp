<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f5ef">
<meta name="description" content="Maletapp. Organiza tus viajes y prepara tu maleta con calma.">
<title>Maletapp · Cuaderno de viaje · Concepto v3</title>
<style>
/* ==========================================================================
   MALETAPP — DESIGN TOKENS
   ========================================================================== */
:root{
  /* Color */
  --color-background: #F7F5EF;
  --color-background-alt: #EDECE3;
  --color-surface: #FFFEFA;
  --color-surface-sunken: #EDECE3;
  --color-text: #293C35;
  --color-text-soft: #394B42;
  --color-muted: #59675F;
  --color-border: #DCDED2;
  --color-border-strong: #7E8B82;

  --color-primary: #A6442F;
  --color-primary-strong: #8C3524;
  --color-primary-soft: #F6E8DF;

  --color-accent: #C47856;
  --color-accent-strong: #A95B3C;
  --color-accent-soft: #F6E8DF;

  --color-success: #32604B;
  --color-success-soft: #E5EDDF;
  --color-warning: #7C5C21;
  --color-warning-soft: #F6ECD1;
  --color-danger: #A33335;
  --color-danger-soft: #FBE9E7;

  --color-focus: #146B7A;
  --color-illustration-sky: #E0E9DC;
  --color-illustration-light: #FAF0CD;
  --color-illustration-mid: #A9BCA4;
  --color-illustration-dark: #526F5D;
  --color-illustration-clay: #C47856;

  /* Type */
  --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-3xl: 2.25rem;

  --leading-tight: 1.15;
  --leading-snug: 1.35;
  --leading-normal: 1.55;

  /* Space */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.75rem;
  --space-8: 3.5rem;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(29,43,51,0.08);
  --shadow-md: 0 6px 20px -4px rgba(29,43,51,0.16);
  --shadow-lg: 0 18px 40px -12px rgba(29,43,51,0.28);

  /* Border widths */
  --border-thin: 1px;
  --border-thick: 1.5px;

  /* Breakpoints (referencia, usados en media queries) */
  --bp-tablet: 768px;
  --bp-desktop: 1024px;
  --bp-wide: 1440px;

  /* Motion */
  --ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
}

/* ==========================================================================
   RESET & BASE
   ========================================================================== */
*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  font-family: var(--font-body);
  background: var(--color-background);
  color: var(--color-text);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{ margin: 0; }
ul{ padding: 0; list-style: none; }
button{ font-family: inherit; }
img,svg{ display: block; max-width: 100%; }
a{ color: inherit; }

button, input, textarea, select{ color: inherit; }

:focus{ outline: none; }
:focus-visible{
  outline: 2.5px solid var(--color-focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

.sr-only{
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

.icon{ width: 20px; height: 20px; flex-shrink: 0; }
.icon-sm{ width: 16px; height: 16px; }
.icon-lg{ width: 28px; height: 28px; }

/* ==========================================================================
   LAYOUT / APP SHELL
   ========================================================================== */
#app{
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-header{
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-background);
  border-bottom: var(--border-thin) solid var(--color-border);
}
.app-header__bar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-4) var(--space-3);
  max-width: 1240px;
  margin: 0 auto;
}
.brand{
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-xl);
  letter-spacing: -0.01em;
  color: var(--color-primary-strong);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
.brand__mark{
  width: 30px; height: 30px;
  color: var(--color-accent);
}
.app-header__actions{ display:flex; align-items:center; gap: var(--space-2); }

.app-main{
  flex: 1;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: var(--space-4) var(--space-4) var(--space-8);
}

.view{ animation: view-in var(--duration-slow) var(--ease-standard); }
@keyframes view-in{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   TYPOGRAPHY HELPERS
   ========================================================================== */
.page-title{
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  line-height: var(--leading-tight);
  color: var(--color-text);
  margin-bottom: var(--space-1);
}
.page-subtitle{
  color: var(--color-muted);
  font-size: var(--text-sm);
  margin-bottom: var(--space-5);
}
.section-heading{
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  margin-bottom: var(--space-3);
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-sm);
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius-pill);
  border: var(--border-thick) solid transparent;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-standard), background var(--duration-base) var(--ease-standard), box-shadow var(--duration-base) var(--ease-standard);
  min-height: 44px;
  white-space: nowrap;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--color-primary); color: #fff; }
.btn-primary:hover{ background: var(--color-primary-strong); }
.btn-accent{ background: var(--color-accent); color: #fff; }
.btn-accent:hover{ background: var(--color-accent-strong); }
.btn-secondary{ background: var(--color-surface); color: var(--color-primary-strong); border-color: var(--color-border-strong); }
.btn-secondary:hover{ background: var(--color-surface-sunken); }
.btn-ghost{ background: transparent; color: var(--color-text-soft); border-color: transparent; padding: 0.6rem 0.9rem; }
.btn-ghost:hover{ background: var(--color-background-alt); }
.btn-danger{ background: var(--color-danger); color: #fff; }
.btn-danger:hover{ background: #963624; }
.btn-danger-ghost{ background: transparent; color: var(--color-danger); border-color: var(--color-danger); }
.btn-danger-ghost:hover{ background: var(--color-danger-soft); }
.btn-block{ width: 100%; }
.btn-sm{ padding: 0.45rem 0.85rem; font-size: var(--text-xs); min-height: 36px; }
.btn-icon{
  width: 40px; height: 40px; padding: 0; border-radius: 50%;
  background: var(--color-surface); border-color: var(--color-border);
  color: var(--color-text-soft);
}
.btn-icon:hover{ background: var(--color-background-alt); }
.btn:disabled{ opacity: 0.5; cursor: not-allowed; transform: none; }

.link-btn{
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--color-primary-strong); font-weight: 600; font-size: var(--text-sm);
  text-decoration: underline; text-decoration-color: var(--color-border-strong);
  text-underline-offset: 3px;
}
.link-btn:hover{ text-decoration-color: currentColor; }

/* ==========================================================================
   FORM FIELDS
   ========================================================================== */
.field{ margin-bottom: var(--space-4); }
.field__label{
  display: block; font-size: var(--text-sm); font-weight: 600;
  margin-bottom: var(--space-2); color: var(--color-text);
}
.field__hint{ font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-1); }
.field__error{
  display: flex; align-items: flex-start; gap: var(--space-1);
  font-size: var(--text-xs); color: var(--color-danger); margin-top: var(--space-2); font-weight: 600;
}
.input, .textarea, .select{
  width: 100%;
  font-family: var(--font-body);
  font-size: var(--text-md);
  padding: 0.75rem 0.9rem;
  border-radius: var(--radius-sm);
  border: var(--border-thick) solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  transition: border-color var(--duration-fast) var(--ease-standard);
}
.input::placeholder, .textarea::placeholder{ color: var(--color-muted); }
.input:focus, .textarea:focus, .select:focus{ border-color: var(--color-primary); }
.textarea{ resize: vertical; min-height: 72px; }
.field.has-error .input, .field.has-error .textarea{ border-color: var(--color-danger); background: var(--color-danger-soft); }
.field-row{ display: flex; gap: var(--space-3); }
.field-row .field{ flex: 1; }

.checkrow{
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3); border-radius: var(--radius-sm);
  background: var(--color-surface-sunken); cursor: pointer;
}
.toggle{
  position: relative; width: 44px; height: 26px; flex-shrink: 0;
  border-radius: var(--radius-pill); background: var(--color-border-strong);
  transition: background var(--duration-base) var(--ease-standard);
}
.toggle::after{
  content:''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm);
  transition: transform var(--duration-base) var(--ease-standard);
}
.toggle.is-on{ background: var(--color-success); }
.toggle.is-on::after{ transform: translateX(18px); }
.checkrow input{ position: absolute; opacity: 0; pointer-events: none; }

/* ==========================================================================
   BADGES (forma de sello de pasaporte, no píldora genérica)
   ========================================================================== */
.stamp{
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: var(--text-xs); font-weight: 700;
  padding: 0.3rem 0.65rem 0.3rem 0.55rem;
  border-radius: 30% 12% 30% 12% / 60% 40% 60% 40%;
  border: var(--border-thick) dashed currentColor;
  transform: rotate(-1.5deg);
  line-height: 1;
}
.stamp .icon{ width: 13px; height: 13px; }
.stamp--upcoming{ color: var(--color-primary-strong); background: var(--color-primary-soft); }
.stamp--preparing{ color: var(--color-accent-strong); background: var(--color-accent-soft); }
.stamp--past{ color: var(--color-muted); background: var(--color-background-alt); border-style: solid; }
.stamp--finished{ color: var(--color-success); background: var(--color-success-soft); }

/* ==========================================================================
   TRIP CARD ("etiqueta de maleta")
   ========================================================================== */
.trip-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
}
.trip-card{
  position: relative;
  background: var(--color-surface);
  border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5) var(--space-4) var(--space-4);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--duration-base) var(--ease-standard), transform var(--duration-base) var(--ease-standard);
}
.trip-card:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
.trip-card.is-past{ opacity: 0.72; }
.trip-card::before{
  /* ojal de la etiqueta */
  content:'';
  position: absolute; top: -7px; left: var(--space-5);
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--color-background);
  border: var(--border-thick) solid var(--color-border);
}
.trip-card__top{
  display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-2);
  margin-bottom: var(--space-2);
}
.trip-card__destination{
  font-family: var(--font-display); font-weight: 600;
  font-size: var(--text-xl); line-height: var(--leading-tight);
}
.trip-card__dates{
  display: flex; align-items: center; gap: var(--space-1);
  color: var(--color-muted); font-size: var(--text-sm); margin-top: var(--space-1);
}
.trip-card__body{ display:flex; align-items:center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-4); }
.trip-card__link{
  position:absolute; inset:0; border-radius: inherit;
}
.trip-card__menu-wrap{ position: relative; z-index: 2; }

.progress-wrap{ flex: 1; }
.progress-label{
  display:flex; justify-content: space-between; font-size: var(--text-xs);
  color: var(--color-text-soft); margin-bottom: var(--space-1); font-weight: 600;
}
.progress-track{
  height: 8px; border-radius: var(--radius-pill); background: var(--color-surface-sunken); overflow: hidden;
}
.progress-fill{
  height: 100%; border-radius: var(--radius-pill); background: var(--color-primary);
  transition: width var(--duration-slow) var(--ease-standard);
}
.progress-fill.is-complete{ background: var(--color-success); }
.progress-fill.is-empty{ background: var(--color-border-strong); }

.icon-btn-menu{
  width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
  color: var(--color-muted); display:flex; align-items:center; justify-content:center; cursor: pointer;
  position: relative; z-index: 2;
}
.icon-btn-menu:hover{ background: var(--color-background-alt); }

.contextual-menu{
  position: absolute; top: 42px; right: 0; z-index: 30;
  background: var(--color-surface); border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  min-width: 190px; padding: var(--space-2); display: none;
}
.contextual-menu.is-open{ display: block; }
.contextual-menu__item{
  display: flex; align-items: center; gap: var(--space-2); width: 100%;
  padding: 0.6rem 0.7rem; border-radius: var(--radius-sm); border: none; background: none;
  font-size: var(--text-sm); font-weight: 500; text-align: left; cursor: pointer; color: var(--color-text);
}
.contextual-menu__item:hover{ background: var(--color-background-alt); }
.contextual-menu__item--danger{ color: var(--color-danger); }
.contextual-menu__item--danger:hover{ background: var(--color-danger-soft); }

/* ==========================================================================
   EMPTY / LOADING / ERROR STATES
   ========================================================================== */
.state-block{
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-7) var(--space-4);
  max-width: 360px; margin: 0 auto;
}
.state-block__icon{ width: 96px; height: 96px; color: var(--color-primary); margin-bottom: var(--space-4); }
.state-block__title{ font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); }
.state-block__desc{ color: var(--color-muted); font-size: var(--text-sm); margin-bottom: var(--space-5); }
.state-block--error .state-block__icon{ color: var(--color-danger); }

.skeleton{ background: var(--color-background-alt); border-radius: var(--radius-lg); overflow: hidden; position: relative; }
.skeleton::after{
  content:''; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer{ from{ transform: translateX(-100%); } to{ transform: translateX(100%); } }
.skeleton-card{ height: 132px; margin-bottom: var(--space-4); }

/* ==========================================================================
   TRIP DETAIL
   ========================================================================== */
.back-link{
  display: inline-flex; align-items: center; gap: var(--space-1);
  color: var(--color-text-soft); font-weight: 600; font-size: var(--text-sm);
  background:none; border:none; cursor:pointer; padding: var(--space-2) 0; margin-bottom: var(--space-2);
}
.detail-header{
  display:flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.detail-header__destination{
  font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 700; line-height: var(--leading-tight);
}
.detail-header__meta{
  display:flex; flex-wrap: wrap; align-items:center; gap: var(--space-3); margin-top: var(--space-2);
  color: var(--color-muted); font-size: var(--text-sm);
}
.meta-item{ display:flex; align-items:center; gap: 0.3rem; }

.ticket-divider{
  position: relative;
  height: 0; border-top: var(--border-thick) dashed var(--color-border-strong);
  margin: var(--space-5) 0;
}
.ticket-divider::before, .ticket-divider::after{
  content:''; position:absolute; top:-10px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--color-background);
}
.ticket-divider::before{ left: -20px; }
.ticket-divider::after{ right: -20px; }

.progress-summary{
  background: var(--color-primary-soft); border-radius: var(--radius-md);
  padding: var(--space-4); display: flex; align-items: center; gap: var(--space-5);
}
.progress-summary__ring{ position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.progress-summary__ring svg{ width: 76px; height: 76px; transform: rotate(-90deg); }
.progress-summary__ring-value{
  position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight: 700; font-size: var(--text-md); color: var(--color-primary-strong);
}
.progress-summary__stats{ display:flex; gap: var(--space-5); }
.progress-summary__stat-num{ font-family: var(--font-display); font-size: var(--text-xl); font-weight: 700; color: var(--color-primary-strong); }
.progress-summary__stat-label{ font-size: var(--text-xs); color: var(--color-text-soft); }

.detail-toolbar{
  display:flex; align-items:center; justify-content: space-between; gap: var(--space-3);
  margin: var(--space-5) 0 var(--space-3);
}
.toolbar-toggles{ display: flex; gap: var(--space-2); }
.chip-toggle{
  border: var(--border-thick) solid var(--color-border); background: var(--color-surface);
  border-radius: var(--radius-pill); padding: 0.4rem 0.8rem; font-size: var(--text-xs); font-weight: 600;
  color: var(--color-text-soft); cursor: pointer;
}
.chip-toggle.is-active{ background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.category-group{ margin-bottom: var(--space-5); }
.category-group__header{
  display:flex; align-items:center; justify-content: space-between; gap: var(--space-2);
  cursor: pointer; padding: var(--space-2) 0; border: none; background: none; width: 100%; text-align: left;
}
.category-group__title{
  display: flex; align-items: center; gap: var(--space-2);
  font-weight: 700; font-size: var(--text-sm); color: var(--color-text-soft);
}
.category-group__count{ color: var(--color-muted); font-weight: 500; }
.category-group__chev{ transition: transform var(--duration-base) var(--ease-standard); color: var(--color-muted); }
.category-group.is-collapsed .category-group__chev{ transform: rotate(-90deg); }
.category-group.is-collapsed .category-group__list{ display: none; }

.item-list{ display: flex; flex-direction: column; gap: var(--space-2); }
.item-row{
  display: flex; align-items: center; gap: var(--space-3);
  background: var(--color-surface); border: var(--border-thin) solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-3);
}
.item-row.is-prepared{ background: var(--color-success-soft); border-color: transparent; }
.item-row__check{
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  border: var(--border-thick) solid var(--color-border-strong); background: var(--color-surface);
  display:flex; align-items:center; justify-content:center; cursor: pointer; color: transparent;
  transition: background var(--duration-fast), border-color var(--duration-fast);
}
.item-row.is-prepared .item-row__check{ background: var(--color-success); border-color: var(--color-success); color: #fff; }
.item-row__icon{
  width: 38px; height: 38px; border-radius: 50%; background: var(--color-surface-sunken);
  display:flex; align-items:center; justify-content:center; flex-shrink: 0; color: var(--color-primary-strong);
}
.item-row__body{ flex: 1; min-width: 0; }
.item-row__name{ font-weight: 600; font-size: var(--text-md); }
.item-row.is-prepared .item-row__name{ text-decoration: line-through; color: var(--color-text-soft); }
.item-row__meta{ display:flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 0.15rem; }
.item-row__qty{ font-size: var(--text-xs); font-weight: 700; color: var(--color-accent-strong); background: var(--color-accent-soft); padding: 0.1rem 0.5rem; border-radius: var(--radius-pill); }
.item-row__note{ font-size: var(--text-xs); color: var(--color-muted); font-style: italic; }
.item-row__actions{ display:flex; gap: var(--space-1); flex-shrink: 0; }
.item-row__actions .btn-icon{ width: 34px; height: 34px; }

/* ==========================================================================
   MODAL / BOTTOM SHEET
   ========================================================================== */
.overlay{
  position: fixed; inset: 0; background: rgba(20,30,34,0.42);
  z-index: 50; display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(1px);
}

  else scene = `<circle cx="286" cy="47" r="22" fill="var(--color-illustration-light)"/><path d="M0 165 74 47l76 91 58-115 92 142 31-45 29 55v55H0Z" fill="var(--color-illustration-mid)"/><path d="m47 91 27-44 42 55-32-18-12 16-11-11Zm128-1 33-67 43 72-28-19-10 16-12-23Z" fill="var(--color-illustration-light)"/><path d="m74 230 95-118 52 65 56-81 83 134Z" fill="var(--color-illustration-dark)"/><path d="M0 195q71-57 147 10t213-8v33H0Z" fill="var(--color-illustration-clay)"/><path d="M183 230q-63-27-20-39t-4-20" fill="none" stroke="var(--color-illustration-light)" stroke-width="9"/>`;
  return `<svg viewBox="0 0 360 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="360" height="230" fill="var(--color-illustration-sky)"/>${scene}</svg>`;
}

function tripStatus(trip){
  if(trip.finished) return 'finished';
  const today = new Date(); today.setHours(0,0,0,0);
  const start = trip.startDate ? new Date(trip.startDate+'T00:00:00') : null;
  const end = trip.endDate ? new Date(trip.endDate+'T00:00:00') : null;
  if(end && end < today) return 'past';
  if(start && start <= today && (!end || end >= today)) return 'preparing';
  if(!start && !end){
    const { pct } = tripProgress(trip);
    return pct > 0 ? 'preparing' : 'upcoming';
  }
  return 'upcoming';
}

function statusMeta(status){
  switch(status){
    case 'upcoming': return { label: 'Próximo', cls: 'stamp--upcoming', icon: 'mapPin' };
    case 'preparing': return { label: 'En preparación', cls: 'stamp--preparing', icon: 'flag' };
    case 'past': return { label: 'Pasado', cls: 'stamp--past', icon: 'calendar' };
    case 'finished': return { label: 'Finalizado', cls: 'stamp--finished', icon: 'check' };
  }
}

function renderTripsView(){

  if(trips.length === 0){

  const cards = trips.map(renderTripCard).join('');

  return `

      <a class="trip-card__link" href="#" data-action="open-trip" data-trip-id="${trip.id}" aria-label="Ver detalle del viaje a ${trip.destination}"></a>

          <div class="contextual-menu" id="menu-${trip.id}" role="menu">
            <button class="contextual-menu__item" type="button" role="menuitem" data-action="open-trip" data-trip-id="${trip.id}">${icon('mapPin','icon icon-sm')} Ver detalle</button>
            <button class="contextual-menu__item contextual-menu__item--danger" type="button" role="menuitem" data-action="confirm-delete-trip" data-trip-id="${trip.id}">${icon('trash','icon icon-sm')} Eliminar viaje</button>

        </div>
      </div>
      <p class="trip-card__caption">${escapeHtml(trip.caption || 'Una nueva historia por empezar.')}</p>
      <span class="stamp ${meta.cls}">${icon(meta.icon,'icon')} ${meta.label}</span>
      <div class="trip-card__body">
        <div class="progress-wrap">
          <div class="progress-label"><span>${prepared} de ${total} items</span><span>${total === 0 ? '—' : pct+'%'}</span></div>
          <div class="progress-track"><div class="progress-fill ${fillClass}" style="width:${total===0?4:pct}%"></div></div>

function renderDetailView(){

  const { total, prepared, pending, pct } = tripProgress(trip);
  const status = tripStatus(trip);
  const meta = statusMeta(status);
  const grouped = !!state.groupByCategory[trip.id];
  const circumference = 2 * Math.PI * 30;
  const dashOffset = circumference - (circumference * pct / 100);

  let itemsMarkup;
  if(total === 0){
    itemsMarkup = `
      <div class="state-block" style="padding-top: var(--space-6);">
        <div class="state-block__icon">${icon('suitcaseEmpty','icon icon-lg').replace('viewBox="0 0 24 24"','viewBox="0 0 40 38"').replace('width="28" height="28"','width="88" height="88"')}</div>

    itemsMarkup = `<ul class="item-list">${trip.items.map(i => renderItemRow(trip, i)).join('')}</ul>`;
  }

  return `
    <div class="view" id="detail-view">
      <button class="back-link" type="button" data-action="go-trips">${icon('chevLeft','icon icon-sm')} Todos los viajes</button>

      <div class="detail-header">
        <div>
          <h1 class="detail-header__destination">${escapeHtml(trip.destination)}</h1>
          <div class="detail-header__meta">
            <span class="meta-item">${icon('calendar','icon icon-sm')} ${dateRangeLabel(trip)}</span>
            <span class="stamp ${meta.cls}">${icon(meta.icon,'icon')} ${meta.label}</span>
          </div>
        </div>
        <div class="trip-card__menu-wrap">
          <button class="icon-btn-menu" type="button" data-action="toggle-trip-menu" data-trip-id="${trip.id}" aria-haspopup="true" aria-expanded="false" aria-label="Más acciones del viaje">
            ${icon('dots')}
          </button>
          <div class="contextual-menu" id="menu-${trip.id}" role="menu">
            ${!trip.finished ? `<button class="contextual-menu__item" type="button" role="menuitem" data-action="mark-finished" data-trip-id="${trip.id}">${icon('flag','icon icon-sm')} Marcar como finalizado</button>` : `<button class="contextual-menu__item" type="button" role="menuitem" data-action="reopen-trip" data-trip-id="${trip.id}">${icon('ring','icon icon-sm')} Reabrir viaje</button>`}

          </div>
        </div>
      </div>

      <div class="progress-summary">
        <div class="progress-summary__ring">
          <svg viewBox="0 0 68 68">
            <circle cx="34" cy="34" r="30" fill="none" stroke="var(--color-surface)" stroke-width="7"></circle>
            <circle cx="34" cy="34" r="30" fill="none" stroke="var(--color-primary)" stroke-width="7"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"></circle>
          </svg>
          <div class="progress-summary__ring-value">${pct}%</div>
        </div>
        <div class="progress-summary__stats">
          <div><div class="progress-summary__stat-num">${prepared}</div><div class="progress-summary__stat-label">Preparados</div></div>
          <div><div class="progress-summary__stat-num">${pending}</div><div class="progress-summary__stat-label">Pendientes</div></div>

          <button class="chip-toggle ${!grouped?'is-active':''}" type="button" data-action="set-grouping" data-trip-id="${trip.id}" data-grouped="false">Lista</button>
          <button class="chip-toggle ${grouped?'is-active':''}" type="button" data-action="set-grouping" data-trip-id="${trip.id}" data-grouped="true">Por categoría</button>
        </div>
      </div>

      ${itemsMarkup}

      ${total > 0 ? `
      <div style="margin-top: var(--space-5);">
        <button class="btn btn-accent btn-block" type="button" data-action="open-add-item" data-trip-id="${trip.id}">${icon('plus')} Añadir item</button>
      </div>` : ''}
    </div>
  `;
}

function renderGroupedItems(trip){
  const byCategory = {};
  trip.items.forEach(item => {
    const cat = item.category || 'otros';
    (byCategory[cat] = byCategory[cat] || []).push(item);
  });
  return Object.keys(CATEGORIES).filter(c => byCategory[c] && byCategory[c].length).map(catKey => {
    const catItems = byCategory[catKey];
    const preparedCount = catItems.filter(i=>i.prepared).length;
    return `
      <div class="category-group">
        <button class="category-group__header" type="button" data-action="toggle-category" aria-expanded="true">
          <span class="category-group__title">${icon(CATEGORIES[catKey].icon,'icon icon-sm')} ${CATEGORIES[catKey].label} <span class="category-group__count">· ${preparedCount}/${catItems.length}</span></span>
          <span class="category-group__chev">${icon('chevDown','icon icon-sm')}</span>
        </button>
        <ul class="item-list category-group__list">${catItems.map(i => renderItemRow(trip, i)).join('')}</ul>
      </div>
    `;
  }).join('');
}

function renderItemRow(trip, item){
  return `
    <li class="item-row ${item.prepared ? 'is-prepared' : ''}" data-item-id="${item.id}">
      <button class="item-row__check" type="button" data-action="toggle-item" data-trip-id="${trip.id}" data-item-id="${item.id}"
        role="checkbox" aria-checked="${item.prepared}" aria-label="${item.prepared ? 'Marcar '+escapeHtml(item.name)+' como pendiente' : 'Marcar '+escapeHtml(item.name)+' como preparado'}">
        ${icon('check','icon icon-sm')}

      <div class="item-row__icon">${icon(iconForItem(item))}</div>
      <div class="item-row__body">

  `;
}

        <h2 class="section-heading">Motion y accesibilidad</h2>
        <p style="color:var(--color-text-soft); font-size:var(--text-sm); max-width:640px;">
          Las transiciones usan <code>--duration-fast/base/slow</code> con una curva estándar. Todo el movimiento no esencial se desactiva
          automáticamente si el sistema tiene activado <code>prefers-reduced-motion</code>. El foco de teclado siempre es visible
          (<code>:focus-visible</code>) y ningún estado se comunica solo con color: los badges añaden icono y texto, los errores añaden icono y mensaje.
        </p>
      </div>
    </div>
  `;
}

/* ==========================================================================
   RENDER RAÍZ + MENÚS CONTEXTUALES
   ========================================================================== */
function render(){
  const main = document.getElementById('app-main');
  if(state.view === 'trips') main.innerHTML = renderTripsView();
  else if(state.view === 'detail') main.innerHTML = renderDetailView();
  else if(state.view === 'design') main.innerHTML = renderDesignSystemView();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function closeAllMenus(){
  document.querySelectorAll('.contextual-menu.is-open').forEach(m => m.classList.remove('is-open'));
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ==========================================================================
   TOASTS
   ========================================================================== */
function showToast(message, type){
  const region = document.getElementById('toast-region');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' toast--'+type : '');
  el.setAttribute('role','status');
  el.innerHTML = (type==='success' ? icon('check') : type==='danger' ? icon('warning') : '') + '<span>'+escapeHtml(message)+'</span>';
  region.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(()=>el.remove(), 260); }, 2600);
}

/* ==========================================================================
   OVERLAY: SHEETS Y DIÁLOGOS
   ========================================================================== */
const overlay = document.getElementById('overlay');
let lastFocusedEl = null;

function openOverlay(innerHtml, focusSelector){
  lastFocusedEl = document.activeElement;
  overlay.innerHTML = innerHtml;
  overlay.classList.add('is-open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  const focusTarget = focusSelector ? overlay.querySelector(focusSelector) : overlay.querySelector('input, textarea, button');
  if(focusTarget) setTimeout(()=>focusTarget.focus(), 30);
}
function closeOverlay(){
  overlay.classList.remove('is-open');
  overlay.setAttribute('aria-hidden','true');
  overlay.innerHTML = '';
  document.body.style.overflow = '';
  if(lastFocusedEl && lastFocusedEl.focus) lastFocusedEl.focus();
}
overlay.addEventListener('click', function(e){ if(e.target === overlay) closeOverlay(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && overlay.classList.contains('is-open')) closeOverlay();
});

/* -------- Crear viaje -------- */
function openCreateTripSheet(){
  openOverlay(`
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="create-trip-title">
      <div class="sheet__handle" aria-hidden="true"></div>
      <div class="sheet__header">
        <h2 class="sheet__title" id="create-trip-title">Nuevo viaje</h2>
        <button class="btn btn-icon" type="button" data-action="close-overlay" aria-label="Cerrar">${icon('close')}</button>
      </div>
      <form id="create-trip-form" novalidate>
        <div class="field" id="field-destination">
          <label class="field__label" for="input-destination">Destino</label>
          <input class="input" id="input-destination" name="destination" type="text" placeholder="¿A dónde vas?" autocomplete="off">
          <p class="field__error" id="error-destination" hidden>${icon('warning','icon icon-sm')} Indica un destino para continuar</p>
        </div>
        <div class="field-row">
          <div class="field" id="field-start">
            <label class="field__label" for="input-start">Fecha de inicio <span style="color:var(--color-muted); font-weight:400;">(opcional)</span></label>
            <input class="input" id="input-start" name="start" type="date">
          </div>
          <div class="field" id="field-end">
            <label class="field__label" for="input-end">Fecha de fin <span style="color:var(--color-muted); font-weight:400;">(opcional)</span></label>
            <input class="input" id="input-end" name="end" type="date">
            <p class="field__error" id="error-dates" hidden>${icon('warning','icon icon-sm')} La fecha de fin no puede ser anterior a la de inicio</p>
          </div>
        </div>
        <div class="sheet__actions">
          <button class="btn btn-secondary" type="button" data-action="close-overlay">Cancelar</button>
          <button class="btn btn-accent" type="submit">Crear viaje</button>
        </div>
      </form>
    </div>
  `, '#input-destination');

  document.getElementById('create-trip-form').addEventListener('submit', function(e){
    e.preventDefault();
    const destination = document.getElementById('input-destination').value.trim();
    const start = document.getElementById('input-start').value;
    const end = document.getElementById('input-end').value;
    let valid = true;

    toggleFieldError('field-destination','error-destination', false);
    toggleFieldError('field-end','error-dates', false);

    if(!destination){
      toggleFieldError('field-destination','error-destination', true);
      valid = false;
    }
    if(start && end && start > end){
      toggleFieldError('field-end','error-dates', true);
      valid = false;
    }
    if(!valid) return;

    const trip = { id: nextId(), destination, startDate: start || null, endDate: end || null, finished: false, items: [] };
    trips.unshift(trip);
    saveState();
    closeOverlay();
    showToast('Viaje a '+destination+' creado', 'success');
    state.view = 'detail';
    state.currentTripId = trip.id;
    render();
  });
}

function toggleFieldError(fieldId, errorId, show){
  document.getElementById(fieldId).classList.toggle('has-error', show);
  document.getElementById(errorId).hidden = !show;
}

/* -------- Añadir / editar item -------- */
function openItemForm(tripId, itemId){
  const trip = getTrip(tripId);
  const editing = !!itemId;
  const item = editing ? trip.items.find(i => i.id === itemId) : null;

  const suggestionsHtml = !editing ? `
    <div class="field">
      <label class="field__label">Sugerencias frecuentes</label>
      <div class="suggestions">
        ${PRESET_ITEMS.map(p => `<button type="button" class="suggestion-chip" data-action="use-preset" data-preset-name="${escapeHtml(p.name)}" data-preset-category="${p.category}"><span class="suggestion-chip__icon">${icon(p.icon)}</span>${p.name}</button>`).join('')}
      </div>
    </div>
  ` : '';

  openOverlay(`
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="item-form-title">
      <div class="sheet__handle" aria-hidden="true"></div>
      <div class="sheet__header">
        <h2 class="sheet__title" id="item-form-title">${editing ? 'Editar item' : 'Añadir item'}</h2>
        <button class="btn btn-icon" type="button" data-action="close-overlay" aria-label="Cerrar">${icon('close')}</button>
      </div>
      <form id="item-form" novalidate>
        ${suggestionsHtml}
        <div class="field" id="field-item-name">
          <label class="field__label" for="input-item-name">Nombre del item</label>
          <input class="input" id="input-item-name" type="text" placeholder="Por ejemplo, camiseta" value="${editing ? escapeHtml(item.name) : ''}" autocomplete="off">
          <p class="field__error" id="error-item-name" hidden>${icon('warning','icon icon-sm')} Escribe un nombre para el item</p>
        </div>
        <div class="field-row">
          <div class="field" id="field-item-qty">
            <label class="field__label" for="input-item-qty">Cantidad <span style="color:var(--color-muted); font-weight:400;">(opcional)</span></label>
            <input class="input" id="input-item-qty" type="number" min="1" step="1" placeholder="1" value="${editing && item.quantity ? item.quantity : ''}">
            <p class="field__error" id="error-item-qty" hidden>${icon('warning','icon icon-sm')} Indica un número mayor que cero</p>
          </div>
          <div class="field" id="field-item-category">
            <label class="field__label" for="input-item-category">Categoría</label>
            <select class="select" id="input-item-category">
              ${Object.entries(CATEGORIES).map(([key,c]) => `<option value="${key}" ${editing && item.category===key ? 'selected' : ''}>${c.label}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="input-item-notes">Notas <span style="color:var(--color-muted); font-weight:400;">(opcional)</span></label>
          <textarea class="textarea" id="input-item-notes" placeholder="Por ejemplo, llevar dos pares extra">${editing ? escapeHtml(item.notes||'') : ''}</textarea>
        </div>
        ${editing ? `
        <div class="checkrow" id="toggle-prepared-row" data-action="toggle-prepared-checkbox">
          <div class="toggle ${item.prepared ? 'is-on':''}" id="prepared-toggle-visual"></div>
          <div>
            <div style="font-weight:600; font-size:var(--text-sm);">Preparado</div>
            <div style="font-size:var(--text-xs); color:var(--color-muted);">Marca el item como listo dentro de la maleta</div>
          </div>
          <input type="checkbox" id="input-item-prepared" ${item.prepared ? 'checked' : ''}>
        </div>` : ''}
        <div class="sheet__actions">
          <button class="btn btn-secondary" type="button" data-action="close-overlay">Cancelar</button>
          <button class="btn btn-accent" type="submit">${editing ? 'Guardar cambios' : 'Añadir item'}</button>
        </div>
      </form>
    </div>
  `, '#input-item-name');

  const toggleRow = document.getElementById('toggle-prepared-row');
  if(toggleRow){
    toggleRow.addEventListener('click', function(e){
      if(e.target.tagName === 'INPUT') return;
      const checkbox = document.getElementById('input-item-prepared');
      checkbox.checked = !checkbox.checked;
      document.getElementById('prepared-toggle-visual').classList.toggle('is-on', checkbox.checked);
    });
  }

  overlay.querySelectorAll('[data-action="use-preset"]').forEach(chip => {
    chip.addEventListener('click', function(){
      document.getElementById('input-item-name').value = chip.getAttribute('data-preset-name');
      const cat = chip.getAttribute('data-preset-category');
      if(cat) document.getElementById('input-item-category').value = cat;
      document.getElementById('input-item-name').focus();
    });
  });

  document.getElementById('item-form').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('input-item-name').value.trim();
    const qtyRaw = document.getElementById('input-item-qty').value;
    const notes = document.getElementById('input-item-notes').value.trim();
    const category = document.getElementById('input-item-category').value;
    let valid = true;

    toggleFieldError('field-item-name','error-item-name', false);
    toggleFieldError('field-item-qty','error-item-qty', false);

    if(!name){ toggleFieldError('field-item-name','error-item-name', true); valid = false; }
    let quantity = null;
    if(qtyRaw !== ''){
      const n = Number(qtyRaw);
      if(!Number.isFinite(n) || n <= 0){ toggleFieldError('field-item-qty','error-item-qty', true); valid = false; }
      else quantity = n;
    }
    if(!valid) return;

    if(editing){
      item.name = name; item.quantity = quantity; item.notes = notes; item.category = category;
      const preparedCheckbox = document.getElementById('input-item-prepared');
      if(preparedCheckbox) item.prepared = preparedCheckbox.checked;
      showToast('Item actualizado', 'success');
    } else {
      trip.items.push({ id: nextId(), name, quantity, notes, prepared: false, category });
      showToast('Item añadido a la maleta', 'success');
    }
    saveState();
    closeOverlay();
    render();
  });
}

/* -------- Confirmaciones destructivas -------- */
function openConfirmDialog({ title, description, confirmLabel, onConfirm }){
  openOverlay(`
    <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <div class="confirm-dialog__icon">${icon('warning')}</div>
      <h2 class="confirm-dialog__title" id="confirm-title">${escapeHtml(title)}</h2>
      <p class="confirm-dialog__desc" id="confirm-desc">${description}</p>
      <div class="confirm-dialog__actions">
        <button class="btn btn-danger" type="button" id="confirm-action-btn">${escapeHtml(confirmLabel)}</button>
        <button class="btn btn-secondary" type="button" data-action="close-overlay">Cancelar</button>
      </div>
    </div>
  `);
  document.getElementById('confirm-action-btn').addEventListener('click', function(){
    onConfirm();
    closeOverlay();
  });
}

function confirmDeleteTrip(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const count = trip.items.length;
  openConfirmDialog({
    title: '¿Eliminar el viaje a '+trip.destination+'?',
    description: 'Se eliminará también'+(count>0 ? ' '+count+(count===1?' item':' items')+' y todas sus notas y cantidades':' toda su información')+'. Esta acción no se puede deshacer.',
    confirmLabel: 'Eliminar viaje',
    onConfirm: function(){
      trips = trips.filter(t => t.id !== tripId);
      saveState();
      if(state.currentTripId === tripId){ state.view = 'trips'; state.currentTripId = null; }
      showToast('Viaje eliminado', 'danger');
      render();
    }
  });
}

function confirmDeleteItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i => i.id === itemId);
  if(!item) return;
  openConfirmDialog({
    title: '¿Eliminar "'+item.name+'"?',
    description: 'Este item se quitará de la lista de equipaje del viaje.',
    confirmLabel: 'Eliminar item',
    onConfirm: function(){
      trip.items = trip.items.filter(i => i.id !== itemId);
      saveState();
      showToast('Item eliminado', 'danger');
      render();
    }
  });
}

/* ==========================================================================
   DELEGACIÓN DE EVENTOS
   ========================================================================== */
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn){
    // clic fuera de un menú contextual: cerrarlo
    if(!e.target.closest('.contextual-menu') && !e.target.closest('.icon-btn-menu')) closeAllMenus();
    return;
  }
  const action = btn.getAttribute('data-action');
  const tripId = btn.getAttribute('data-trip-id');
  const itemId = btn.getAttribute('data-item-id');

  switch(action){
    case 'go-trips':
      e.preventDefault();
      state.view = 'trips'; state.currentTripId = null; state.simulateLoading = false; state.simulateError = false;
      render();
      break;
    case 'go-design':
      e.preventDefault();
      state.view = 'design';
      render();
      break;
    case 'open-trip':
      e.preventDefault();
      closeAllMenus();
      state.view = 'detail'; state.currentTripId = tripId;
      render();
      break;
    case 'open-create-trip':
      openCreateTripSheet();
      break;
    case 'toggle-trip-menu': {
      const menu = document.getElementById('menu-'+tripId);
      const isOpen = menu.classList.contains('is-open');
      closeAllMenus();
      if(!isOpen){ menu.classList.add('is-open'); btn.setAttribute('aria-expanded','true'); }
      else btn.setAttribute('aria-expanded','false');
      break;
    }
    case 'confirm-delete-trip':
      closeAllMenus();
      confirmDeleteTrip(tripId);
      break;
    case 'mark-finished':
      closeAllMenus();
      getTrip(tripId).finished = true;
      saveState();
      showToast('Viaje marcado como finalizado', 'success');
      render();
      break;
    case 'reopen-trip':
      closeAllMenus();
      getTrip(tripId).finished = false;
      saveState();
      showToast('Viaje reabierto', 'success');
      render();
      break;
    case 'open-add-item':
      openItemForm(tripId, null);
      break;
    case 'open-edit-item':
      openItemForm(tripId, itemId);
      break;
    case 'confirm-delete-item':
      confirmDeleteItem(tripId, itemId);
      break;
    case 'toggle-item': {
      const trip = getTrip(tripId);
      const item = trip.items.find(i => i.id === itemId);
      item.prepared = !item.prepared;
      saveState();
      render();
      break;
    }
    case 'set-grouping':
      state.groupByCategory[tripId] = btn.getAttribute('data-grouped') === 'true';
      render();
      break;
    case 'toggle-category':
      btn.closest('.category-group').classList.toggle('is-collapsed');
      break;
    case 'close-overlay':
      closeOverlay();
      break;
    case 'retry-load':
      state.simulateError = false;
      render();
      break;
  }
});

/* ==========================================================================
   INICIO
   ========================================================================== */
render();

})();
</script>
</body>
</html>
