openapi: 3.0.0
info:
  title: Trips API
  description: Maletapp Trips api
  version: 0.0.2
paths:
  /trips:
    get:
      tags:
        - Trips
      summary: Get a list of the user trips
      operationId: getTrips
      responses:
        200:
          description: Trip list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        401:
          description: Unauthorized
        500:
          description: Internal server error
    post:
      tags:
        - Trips
      summary: Create a new trip for the user
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTrip'
      responses:
        201:
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        400:
          description: Bad request
        401:
          description: Unauthorized
        500:
          description: Internal server error
  /trips/{tripId}:
    get:
      tags:
        - Trips
      summary: Get a trip by ID
      operationId: getTripById
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip to retrieve
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Trip retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Trip not found
        500:
          description: Internal server error
    delete:
      tags:
        - Trips
      summary: Delete a trip by ID
      operationId: deleteTrip
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID of the trip to delete
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Trip deleted successfully (no content)
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Trip not found
        500:
          description: Internal server error
    
  /trips/{tripId}/finish:
    post:
      tags: [Trips]
      operationId: finishTrip
      summary: Finish an owned trip
      description: Bodyless idempotent desired-state command; preserves dates and items, including empty and incomplete trips.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Desired state applied or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Trip not found
        '500':
          description: Internal server error
  /trips/{tripId}/reopen:
    post:
      tags: [Trips]
      operationId: reopenTrip
      summary: Reopen an owned trip
      description: Bodyless idempotent desired-state command; preserves dates and items, including empty and incomplete trips.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Desired state applied or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Trip not found
        '500':
          description: Internal server error

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NewTrip:
      type: object
      allOf:
        - $ref: '#/components/schemas/TripProperties'
      required: [destination]
    Trip:
      type: object
      allOf:
        - $ref: '#/components/schemas/TripProperties'
      required: [id, destination, isFinished]
    TripProperties: 
      type: object
      properties:
        isFinished:
          type: boolean
          readOnly: true
          default: false
          description: Explicit lifecycle state, independent of dates and packing; finished trips remain editable.
        id:
          readOnly: true
          type: string
          format: uuid
          description: The unique identifier for the trip
        destination:
          type: string
          description: The destination of the trip
          nullable: true
        startDate:
          type: string
          format: date
          description: The start date of the trip
          nullable: true
        endDate:
          type: string
          format: date
          description: The end date of the trip
          nullable: true
